# Ghostty — Linux/GTK half. Linked to ~/.config/ghostty/platform.conf.
#
# Every cmd+* bind from the macOS half becomes ctrl+shift+*: on Linux, plain
# ctrl+d is EOF and ctrl+c is SIGINT, so the shift is not decoration.

# Client-side on purpose. niri draws no titlebars at all, so `server` — which
# is what its prefer-no-csd asks for — leaves the window with no close button
# and nothing to drag. GTK's own decoration is the only thing that can put a
# control on the window itself, so the compositor's preference loses here.
gtk-titlebar = true
gtk-titlebar-style = native
gtk-toolbar-style = flat
gtk-tabs-location = top
gtk-single-instance = true
window-decoration = client

# Bound because the decoration is a rice decision you want to reverse for one
# screenshot, not by editing this file and restarting. It also works on a
# window that is already open, which `window-decoration` above does not.
keybind = ctrl+shift+b=toggle_window_decorations

# --- Quick terminal --------------------------------------------------------
# The dropdown works on Linux, but `global:` hotkeys do not: GTK has no
# system-wide hotkey API. The compositor owns that binding instead — see
# linux/niri/config.kdl, which spawns Ghostty on Mod+Return.
quick-terminal-position = top
quick-terminal-animation-duration = 0.12
quick-terminal-autohide = true
keybind = ctrl+shift+grave_accent=toggle_quick_terminal

# --- Copy and paste, on the keys everything else uses ----------------------
# ctrl+c is SIGINT and that is not negotiable, so the header above is only half
# true now: `performable:` is what makes the other half work. A performable
# bind is consumed ONLY if its action did something — and copy_to_clipboard
# does nothing without a selection. So ctrl+c copies when text is selected and
# sends SIGINT when it is not, which is the behaviour you actually want from
# both keys and could not previously have from one.
#
# copy-on-select is already on, so most of the time the selection is in the
# clipboard before this bind is reached. It earns its place for the times you
# select, keep working, and then reach for the key out of habit.
keybind = performable:ctrl+c=copy_to_clipboard
keybind = ctrl+v=paste_from_clipboard

# ctrl+shift+c/v stay bound to the same two actions — muscle memory from every
# other Linux terminal, and the only way to paste while a program is reading
# ctrl+v itself.
keybind = ctrl+shift+c=copy_to_clipboard
keybind = ctrl+shift+v=paste_from_clipboard

# Three that deliberately did NOT get this treatment, because "similar for the
# respective shortcuts" stops being an improvement here:
#
#   ctrl+a  is this rice's tmux prefix, and readline's beginning-of-line.
#           Binding it to select_all would break every tmux keystroke on the
#           machine, which is a high price for a shortcut you use once a week.
#   ctrl+w  is readline's delete-previous-word. Used constantly; "close tab"
#           is not worth it.
#   ctrl+t  is readline's transpose-chars, and shells bind it to fzf's file
#           widget. New tab stays on ctrl+shift+t.
#
# ctrl+v was readline's quoted-insert, and that one IS taken. ctrl+q does the
# same job if you ever need to type a literal control character.

# --- Splits / tabs ---------------------------------------------------------
keybind = ctrl+shift+d=new_split:right
keybind = ctrl+alt+shift+d=new_split:down
keybind = ctrl+shift+h=goto_split:left
keybind = ctrl+shift+l=goto_split:right
keybind = ctrl+shift+k=goto_split:up
keybind = ctrl+shift+j=goto_split:down
