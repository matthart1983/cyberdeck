# Ghostty — Linux/GTK half. Linked to ~/.config/ghostty/platform.conf.
#
# Every cmd+* bind from the macOS half becomes ctrl+shift+*: on Linux, plain
# ctrl+d is EOF and ctrl+c is SIGINT, so the shift is not decoration.

# Client-side on purpose. niri draws no titlebars at all, so `server` — which
# is what its prefer-no-csd asks for — leaves the window with no close button
# and nothing to drag. GTK's own decoration is the only thing that can put a
# control on the window itself, so the compositor's preference loses here.
gtk-titlebar = true
gtk-titlebar-style = native
gtk-toolbar-style = flat
gtk-tabs-location = top
gtk-single-instance = true
window-decoration = client

# Bound because the decoration is a rice decision you want to reverse for one
# screenshot, not by editing this file and restarting. It also works on a
# window that is already open, which `window-decoration` above does not.
keybind = ctrl+shift+b=toggle_window_decorations

# --- Quick terminal --------------------------------------------------------
# The dropdown works on Linux, but `global:` hotkeys do not: GTK has no
# system-wide hotkey API. The compositor owns that binding instead — see
# linux/niri/config.kdl, which spawns Ghostty on Mod+Return.
quick-terminal-position = top
quick-terminal-animation-duration = 0.12
quick-terminal-autohide = true
keybind = ctrl+shift+grave_accent=toggle_quick_terminal

# --- Splits / tabs ---------------------------------------------------------
keybind = ctrl+shift+d=new_split:right
keybind = ctrl+alt+shift+d=new_split:down
keybind = ctrl+shift+h=goto_split:left
keybind = ctrl+shift+l=goto_split:right
keybind = ctrl+shift+k=goto_split:up
keybind = ctrl+shift+j=goto_split:down
