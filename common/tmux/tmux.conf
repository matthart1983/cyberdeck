# ---------------------------------------------------------------------------
# Cyberpunk rice — tmux
# ~/.dotfiles/common/tmux/tmux.conf  ->  ~/.config/tmux/tmux.conf
# Rendered from themes/ice.sh by `theme` — edit the .tmpl, not this.
# ---------------------------------------------------------------------------

# --- Core ------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:Tc,foot:Tc,*256col*:Tc"
set -g mouse on
set -g escape-time 0
set -g history-limit 100000
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S · #W"

# --- Prefix: C-a, easier to reach than C-b --------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Splits that keep the cwd ---------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Vim-style navigation and resize --------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind r source-file ~/.config/tmux/tmux.conf \; display-message "  config reloaded"

# --- Copy mode -------------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection

# The clipboard command is the only platform-dependent line in this file.
# wl-copy on Wayland, pbcopy on macOS; if-shell picks at config-load time.
if-shell 'command -v wl-copy' {
  bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
} {
  bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
}

# ---------------------------------------------------------------------------
# Ice  (literal hex: tmux has no shell variables — which is
# why this file is rendered rather than written)
# ---------------------------------------------------------------------------
# --- Panes: the accent colour on the active one ---------------------------
set -g pane-border-style "fg=#4a6fa5"
set -g pane-active-border-style "fg=#5ec8ff"
set -g pane-border-lines heavy
set -g display-panes-colour "#4a6fa5"
set -g display-panes-active-colour "#5ec8ff"

# --- Messages / copy mode --------------------------------------------------
set -g message-style "fg=#05080d,bg=#5ec8ff,bold"
set -g message-command-style "fg=#c9dcea,bg=#0e141d"
setw -g mode-style "fg=#05080d,bg=#c9dcea"

# --- Status bar ------------------------------------------------------------
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=#6b8199,bg=#05080d"

# Left: session name in a magenta block, powerline-capped.
set -g status-left-length 40
set -g status-left "#[fg=#05080d,bg=#5ec8ff,bold]  #S #[fg=#5ec8ff,bg=#05080d,nobold]"

# Right: host, battery, clock — each in its own dim/neon step.
set -g status-right-length 90
set -g status-right "#[fg=#4a6fa5,bg=#05080d]#[fg=#c9dcea,bg=#4a6fa5] 󰇅 #h #[fg=#0e141d,bg=#4a6fa5]#[fg=#c9dcea,bg=#0e141d] #(~/.dotfiles/common/bin/tmux-battery) #[fg=#5ec8ff,bg=#0e141d]#[fg=#05080d,bg=#5ec8ff,bold] %H:%M "

# Windows: inactive dim cyan, active hot magenta.
setw -g window-status-format "#[fg=#6b8199,bg=#05080d]  #I·#W  "
setw -g window-status-current-format "#[fg=#0e141d,bg=#05080d]#[fg=#5ec8ff,bg=#0e141d,bold]  #I·#W  #[fg=#0e141d,bg=#05080d]"
setw -g window-status-separator ""
setw -g window-status-bell-style "fg=#ff5c72,bg=#05080d,bold"
setw -g window-status-activity-style "fg=#7fd6b5,bg=#05080d"

# --- The right button ------------------------------------------------------
# `mouse on` is why Ghostty's own context menu never appears inside tmux: with
# mouse reporting enabled tmux consumes button 3 before the terminal sees it,
# so right-clicking a pane did nothing at all. Ghostty 1.3's
# right-click-action defaults to context-menu and is correct — it just never
# gets the event.
#
# Turning the mouse off to get the menu back would be the wrong trade; this
# gives tmux its own instead, on the same button, with the things a pane is
# actually asked for. display-menu positions at the pointer with -x M -y M.
#
# Three menus, because a right-click means something different depending on
# what is under it — tmux tells them apart itself, and the pane one is the
# only one anybody hits by accident, so its destructive row sits last and
# behind a confirm.
bind-key -n MouseDown3Pane display-menu -T "#[align=centre]#{pane_index}  #{pane_current_command}" -x M -y M \
  "Copy mode"            [ "copy-mode" \
  "Paste"                ] "paste-buffer -p" \
  "" \
  "Split right"          h "split-window -h -c '#{pane_current_path}'" \
  "Split down"           v "split-window -v -c '#{pane_current_path}'" \
  "Zoom"                 z "resize-pane -Z" \
  "" \
  "New window"           c "new-window -c '#{pane_current_path}'" \
  "Rename window"        , "command-prompt -I '#W' 'rename-window %%'" \
  "" \
  "Kill pane"            x "confirm-before -p 'kill pane #P? (y/n)' kill-pane"

bind-key -n MouseDown3Status display-menu -T "#[align=centre]#{window_index}  #{window_name}" -x M -y M \
  "Rename"               , "command-prompt -I '#W' 'rename-window %%'" \
  "Move left"            < "swap-window -t:-1 \\; select-window -t:-1" \
  "Move right"           > "swap-window -t:+1 \\; select-window -t:+1" \
  "" \
  "New window"           c "new-window" \
  "" \
  "Kill window"          X "confirm-before -p 'kill window #W? (y/n)' kill-window"

bind-key -n MouseDown3StatusLeft display-menu -T "#[align=centre]#{session_name}" -x M -y M \
  "Rename session"       $ "command-prompt -I '#S' 'rename-session %%'" \
  "New session"          s "new-session" \
  "Choose session"       w "choose-tree -Zs" \
  "" \
  "Detach"               d detach-client \
  "" \
  "Kill session"         X "confirm-before -p 'kill session #S? (y/n)' kill-session"

# The menu takes the same palette as everything else, so a right-click inside
# a terminal and a right-click on the bar above it look like one system.
set -g menu-style "fg=#c9dcea,bg=#0e141d"
set -g menu-selected-style "fg=#05080d,bg=#5ec8ff,bold"
set -g menu-border-style "fg=#4a6fa5"
set -g menu-border-lines rounded

# --- Clock mode ------------------------------------------------------------
setw -g clock-mode-colour "#5ec8ff"
setw -g clock-mode-style 24

# ---------------------------------------------------------------------------
# Plugins (tpm) — keep this block last
# ---------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.config/tmux/plugins/tpm/tpm'
