# ~/.dotfiles/linux/systemd/environment.d/cyberdeck.conf
#   ->  ~/.config/environment.d/cyberdeck.conf
#
# The session's PATH, and the reason there is a file here at all.
#
# niri runs as `niri --session` under `systemd --user`, and that manager's PATH
# is /usr/local/bin:/usr/bin. Everything the compositor spawns inherits it:
# waybar, fuzzel, nwg-drawer, and — because Ghostty is single-instance — the
# ONE ghostty process that then runs every `ghostty -e <tool>` on the machine.
#
# So without this file the rice half-works in a way that is genuinely hard to
# read: `ghostty -e btop` opens, because btop is in /usr/bin, while
# `ghostty -e hud` and `ghostty -e netwatch` open a window that dies before it
# can print "command not found". Nothing is misconfigured; the tools are simply
# not on the PATH of the process being asked to run them.
#
# systemd's environment generators expand $HOME and $PATH here, which is what
# makes this the one place the list can live without being hardcoded to a
# username. It is read when `systemd --user` starts, so it takes effect at the
# next login — `rice-doctor` says so when the running session predates it.
PATH=$HOME/.cargo/bin:$HOME/.local/bin:$HOME/.dotfiles/common/bin:$PATH
